<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
<title>Piano</title>
<!-- Piano from the phone. Source: hub/web/piano/index.html; published copy: github.com/hgzech/piano (GitHub Pages).
     Reads /piano on the Europe database (hgzech-home); writes only new /piano/cmd records (hub/firebase/database.rules.json). -->

<!-- ===================== LOOK (colours, sizes, layout) — change freely, no logic here ===================== -->
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --bar-bg: rgba(248, 248, 250, .94);
    --text: #111114;
    --text-2: #6b6b72;          /* second line, composer headers */
    --text-3: #a0a0a8;          /* quiet parts of titles */
    --sep: rgba(0, 0, 0, .08);
    --fill: rgba(118, 118, 128, .12);   /* search field, idle buttons */
    --accent: #2563eb;          /* the one accent: playing song, Stop when live */
    --on-accent: #ffffff;
    --ok: #22a559;
    --bad: #e5484d;
    --warn: #b7700a;
    --gutter: 16px;
    --row-pad: 11px;
    --bar-h: 76px;              /* room kept free under the list for the bottom bar */
    --search-h: 58px;           /* sticky search strip; composer headers stick just below it */
    --font: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  /* dark: follows the phone's setting */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e0e10;
      --bar-bg: rgba(30, 30, 33, .94);
      --text: #f2f2f4;
      --text-2: #a0a0a8;
      --text-3: #6c6c74;
      --sep: rgba(255, 255, 255, .09);
      --fill: rgba(118, 118, 128, .24);
      --accent: #5b8cff;
      --on-accent: #0e0e10;
      --ok: #34c46e;
      --bad: #ff6369;
      --warn: #f0a040;
    }
  }

  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 17px/1.35 var(--font); -webkit-text-size-adjust: 100%;
         -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  main { max-width: 640px; margin: 0 auto; padding: env(safe-area-inset-top) 0 calc(var(--bar-h) + env(safe-area-inset-bottom) + 24px); }
  button { font: inherit; color: inherit; touch-action: manipulation; }
  [hidden] { display: none !important; }

  /* header + search */
  header { padding: 18px var(--gutter) 6px; }
  h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
  .search { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px var(--gutter) 10px;
            height: var(--search-h); box-sizing: border-box; }
  #q { width: 100%; height: 40px; box-sizing: border-box; border: 0; border-radius: 10px; background: var(--fill); color: var(--text);
       font: 17px var(--font); padding: 0 12px; outline: none; -webkit-appearance: none; appearance: none; }
  #q::placeholder { color: var(--text-2); }

  /* list */
  ul { list-style: none; margin: 0; padding: 0; }
  li.hdr { position: sticky; top: var(--search-h); z-index: 1; background: var(--bg); color: var(--text-2);
           font-size: 13px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
           padding: 18px var(--gutter) 6px; }
  .row { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: none; border: 0;
         padding: var(--row-pad) var(--gutter); }
  .row:active { background: var(--fill); }
  .txt { flex: 1; min-width: 0; }
  .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* one line: all rows same height */
  .x { color: var(--text-3); }
  .s { display: block; color: var(--text-2); font-size: 14px; margin-top: 1px;
       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.current .t { color: var(--accent); font-weight: 600; }
  .row .mark { flex: none; width: 18px; height: 18px; display: none; }
  li.current .row .mark.eq { display: flex; }
  li.waiting .row .mark.spin { display: block; }
  li.waiting .row .mark.eq { display: none; }
  #empty, #nomatch { color: var(--text-2); padding: 24px var(--gutter); margin: 0; }
  #signout { display: block; margin: 28px auto 0; background: none; border: 0; color: var(--text-2); font-size: 15px; padding: 10px; }

  /* playing / waiting marks */
  .eq { display: flex; align-items: flex-end; gap: 2px; }
  .eq i { flex: 1; background: var(--accent); border-radius: 1px; height: 30%; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.4s; } .eq i:nth-child(3) { animation-delay: -.7s; }
  @keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
  .spin { border: 2px solid var(--fill); border-top-color: var(--accent); border-radius: 50%; box-sizing: border-box;
          animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .eq i, .spin { animation: none; } .eq i { height: 70%; } }

  /* bottom bar: what's playing, status, problems, Stop */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--bar-bg);
         -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
         border-top: 1px solid var(--sep); padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom)); }
  #bar .in { max-width: 608px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 52px; }
  #barMark { flex: none; width: 22px; height: 22px; display: grid; place-items: center; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-3); }
  #dot.on { background: var(--ok); } #dot.off { background: var(--bad); }
  #barMark .eq, #barMark .spin { width: 18px; height: 18px; }
  #barTxt { flex: 1; min-width: 0; }
  #line { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub { color: var(--text-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub.warn, #sub.fail { white-space: normal; }   /* problems may take a few lines */
  #sub:empty { display: none; }
  #sub.warn { color: var(--warn); } #sub.fail { color: var(--bad); }
  #stop { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--fill);
          display: grid; place-items: center; position: relative; }
  #stop::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: var(--text-2); }
  #stop.live { background: var(--accent); }
  #stop.live::before { background: var(--on-accent); }
  #stop:active { transform: scale(.94); }
  #stop.waiting::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent;
                         border-top-color: var(--accent); animation: spin .8s linear infinite; }

  /* sign-in */
  #signin-box { min-height: 70vh; display: grid; place-content: center; gap: 18px; text-align: center; padding: 0 var(--gutter); }
  #signin-box p { margin: 0; color: var(--text-2); }
  #signin { border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 600; padding: 14px 28px; }
</style>
</head>
<body>
<main>
  <header><h1>Piano</h1></header>
  <div id="signin-box" hidden>
    <p>Sign in to play the piano.</p>
    <button id="signin">Sign in with Google</button>
  </div>
  <div id="app" hidden>
    <div class="search"><input id="q" type="search" placeholder="Search songs, composers, pianists"
         autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>
    <p id="empty" hidden>No songs on the hub yet.</p>
    <p id="nomatch" hidden>No matches.</p>
    <ul id="songs"></ul>
    <button id="signout">Sign out</button>
  </div>
</main>
<div id="bar" hidden>
  <div class="in">
    <div id="barMark"><span id="dot"></span></div>
    <div id="barTxt"><div id="line">…</div><div id="sub"></div></div>
    <button id="stop" aria-label="Stop"></button>
  </div>
</div>

<!-- ===================== LOGIC ===================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getDatabase, ref, push, onValue, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

// Same Firebase project and web config as the plug page (not secret; access is enforced by the database rules).
const firebaseConfig = {
  apiKey: "AIzaSyBlOlfmPbzm5fyTPtsASnBwFhWTRJ816Ac",
  authDomain: "ikea-plug-bridge-hz.firebaseapp.com",
  databaseURL: "https://ikea-plug-bridge-hz-default-rtdb.firebaseio.com",
  projectId: "ikea-plug-bridge-hz",
  storageBucket: "ikea-plug-bridge-hz.firebasestorage.app",
  messagingSenderId: "98941497958",
  appId: "1:98941497958:web:c10640d0b2a0ac42fcf3a7"
};
const DB_URL = "https://hgzech-home.europe-west1.firebasedatabase.app";
const HUB_STALE_MS = 60000;   // heartbeat older than this: hub offline
const FAIL_MS = 15000;        // no result this long after the tap: "no answer from the hub, not played"
const RING_MS = 1000;         // spinner only if the answer takes longer than this

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app, DB_URL);
const $ = (id) => document.getElementById(id);

let state = null, heartbeat = null, songs = {}, offset = 0, unsubs = [];
let connected = null, everConnected = false;   // Firebase connection of THIS phone (.info/connected)
let denied = false;                            // signed-in account isn't allowed by the rules
// This phone's latest tap { id, action, song, cts, rec }. Only its outcome is shown; older taps are ignored.
let tap = null, tapUnsub = null;

// ---- display helpers (presentation only; the data in Firebase is not changed) ----
// Title split into the main part and a quieter extra part (movement after ":", or a trailing "(collection)").
function splitTitle(raw) {
  let t = (raw || "").replace(/,\s*(No\.|Nr\.)/g, " $1").replace(/--/g, "–").replace(/\s+=\s*(?=\()/, " ").trim();
  let m = t.match(/^(.+?)\s*:\s+(.+)$/);
  if (m) return [m[1], m[2].replace(/^\((.*)\)$/, "$1")];
  m = t.match(/^(.+?)\s+\((.+)\)$/);
  if (m) return [m[1], m[2]];
  return [t, ""];
}
const titleOf = (id) => (songs[id] && songs[id].title) || id || "";
const shortTitle = (id) => splitTitle(titleOf(id))[0] || id || "";
const quoted = (id) => `“${shortTitle(id)}”`;
const fold = (s) => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss").replace(/ø/g, "o")
  .replace(/ł/g, "l").replace(/æ/g, "ae").toLowerCase();
const surname = (c) => (c || "").replace(/\(.*?\)/g, "").trim().split(/\s+/).pop() || "";

const hubUp = () => heartbeat != null && Date.now() + offset - heartbeat < HUB_STALE_MS;
const phoneOffline = () => connected === false && everConnected;
const answered = () => !!(tap && tap.rec && tap.rec.result);
const pending = () => !!tap && !answered() && Date.now() - tap.cts <= FAIL_MS;
const what = (t) => t.action === "stop" ? "Stop" : quoted(t.song);

// What to say about the latest tap: null while waiting or when it simply worked.
function tapFailure() {
  if (!tap) return null;
  const r = tap.rec;
  if (answered()) {
    if (r.result === "failed") return `${what(tap)} failed: ${r.reason || "no reason given"}.`;
    return r.reason ? `${what(tap)}: ${r.reason}.` : null;   // done, but the hub added a note later
  }
  if (Date.now() - tap.cts > FAIL_MS)
    return `${what(tap)}: no answer from the hub, not ${tap.action === "stop" ? "stopped" : "played"}.`;
  return null;
}

const EQ = '<span class="eq"><i></i><i></i><i></i></span>';
let barMarkKind = "";
function setBarMark(kind, dotClass) {             // kind: dot | eq | spin
  if (kind !== barMarkKind) {
    $("barMark").innerHTML = kind === "eq" ? EQ : kind === "spin" ? '<span class="spin"></span>' : '<span id="dot"></span>';
    barMarkKind = kind;
  }
  if (kind === "dot") $("dot").className = dotClass;
}

function render() {
  let dot = "", line = "…", warn = "", mark = "dot";
  const s = state || {};
  const busy = pending(), ring = busy && Date.now() - tap.cts >= RING_MS;
  let current = null, starting = false;                 // song shown as playing
  if (!auth.currentUser) {
    line = "Piano";
  } else if (denied) {
    dot = "off"; line = "No access";
    warn = `This Google account (${auth.currentUser && auth.currentUser.email}) isn't allowed. Ask Hilmar to add it.`;
  } else if (phoneOffline()) {
    dot = "wait"; line = "This phone is offline";
    warn = "Reconnecting… What you see may be out of date; a tap only counts if it reaches the hub within 10 s.";
  } else if (heartbeat == null && state == null) {
    line = "Connecting…";
  } else if (!hubUp()) {
    dot = "off"; line = "Hub offline";
    warn = "The hub at home isn't answering, so nothing can be played or stopped right now.";
  } else if (s.status === "offline") {
    dot = "off"; line = "Piano offline";
    warn = "The hub can't reach the piano board (unplugged or no power?).";
  } else {
    dot = "on";
    if (s.status === "playing") { current = s.song; }
    else if (s.status === "loading") { line = "Loading…"; mark = "spin"; }
    else if (s.status === "error") { dot = "off"; line = "Piano problem"; warn = s.error ? `${s.error[0].toUpperCase()}${s.error.slice(1)}.` : ""; }
    else line = "Ready";
    if (busy) {                                          // optimistic: show what the tap is doing
      if (tap.action === "play") { current = tap.song; starting = true; }
      else { current = null; line = "Stopping…"; mark = "spin"; }
    }
  }
  const f = tapFailure();
  let sub = warn, subClass = warn ? "warn" : "";
  if (current) {
    const so = songs[current] || {};
    line = shortTitle(current);
    sub = starting ? "Starting…" : [so.composer, so.performer].filter(Boolean).join(" · ");
    subClass = ""; mark = starting ? "spin" : "eq";
  }
  if (f && !denied) { sub = f; subClass = "fail"; }
  setBarMark(mark, dot);
  $("line").textContent = line;
  $("sub").textContent = sub;
  $("sub").className = subClass;
  $("stop").classList.toggle("live", !denied && hubUp() && (s.status === "playing" || s.status === "loading" || (busy && tap.action === "play")));
  $("stop").classList.toggle("waiting", ring && tap.action === "stop");
  for (const li of $("songs").querySelectorAll("li.song")) {
    li.classList.toggle("current", li.dataset.id === current);
    li.classList.toggle("waiting", ring && tap.action === "play" && tap.song === li.dataset.id);
  }
}
setInterval(render, 1000);

// List grouped by composer (sorted by surname), titles sorted within each composer; songs without composer last.
function renderSongs() {
  const coll = new Intl.Collator(undefined, { sensitivity: "base", numeric: true });
  const ids = Object.keys(songs);
  const groups = new Map();
  for (const id of ids) {
    const c = (songs[id] && songs[id].composer) || "";
    if (!groups.has(c)) groups.set(c, []);
    groups.get(c).push(id);
  }
  const names = [...groups.keys()].sort((a, b) =>
    (!a) - (!b) || coll.compare(surname(a), surname(b)) || coll.compare(a, b));
  const ul = $("songs");
  ul.replaceChildren();
  for (const c of names) {
    const h = document.createElement("li"); h.className = "hdr"; h.textContent = c || "Other";
    ul.append(h);
    const list = groups.get(c).sort((a, b) => coll.compare(titleOf(a), titleOf(b)) || coll.compare(a, b));
    for (const id of list) {
      const s = songs[id] || {};
      const li = document.createElement("li"); li.className = "song"; li.dataset.id = id;
      li.dataset.q = fold([s.title, s.composer, s.performer, id].join(" "));
      const b = document.createElement("button"); b.className = "row";
      const txt = document.createElement("span"); txt.className = "txt";
      const t = document.createElement("span"); t.className = "t";
      const [main, extra] = splitTitle(s.title || id);
      t.textContent = main;
      if (extra) { const x = document.createElement("span"); x.className = "x"; x.textContent = " · " + extra; t.append(x); }
      txt.append(t);
      if (s.performer) { const e = document.createElement("span"); e.className = "s"; e.textContent = s.performer; txt.append(e); }
      b.append(txt);
      b.insertAdjacentHTML("beforeend", '<span class="mark eq"><i></i><i></i><i></i></span><span class="mark spin"></span>');
      b.onclick = () => send("play", id);
      li.append(b); ul.append(li);
    }
  }
  $("empty").hidden = ids.length > 0;
  filter();
  render();
}

function filter() {
  const words = fold($("q").value).split(/\s+/).filter(Boolean);
  let shown = 0, hdr = null, hdrHas = false;
  const close = () => { if (hdr) hdr.hidden = !hdrHas; };
  for (const li of $("songs").children) {
    if (li.classList.contains("hdr")) { close(); hdr = li; hdrHas = false; continue; }
    const ok = words.every(w => li.dataset.q.includes(w));
    li.hidden = !ok;
    if (ok) { shown++; hdrHas = true; }
  }
  close();
  $("nomatch").hidden = !(words.length && shown === 0);
}
$("q").addEventListener("input", filter);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });

function send(action, song) {
  const u = auth.currentUser;
  if (!u || denied) return;
  const cts = Date.now();
  const rec = { action, by: u.uid, tap: Math.round(cts + offset), ts: serverTimestamp() };
  if (action === "play") rec.song = song;
  const r = push(ref(db, "piano/cmd"), rec);   // queued by the SDK if offline; the hub rejects it if it arrives > 10 s late
  const t = { id: r.key, action, song, cts, rec: null };
  if (tapUnsub) tapUnsub();
  tap = t;
  tapUnsub = onValue(ref(db, "piano/cmd/" + t.id), x => { if (x.val()) { t.rec = x.val(); render(); } }, () => {});
  r.catch(e => { if (tap === t) { t.rec = { result: "failed", reason: `this phone couldn't send it (${e.code || e.message})` }; render(); } });
  render();
  setTimeout(render, RING_MS + 20);
  setTimeout(render, FAIL_MS + 20);
}
$("stop").onclick = () => send("stop");

$("signin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider())
  .catch(e => { $("signin-box").querySelector("p").textContent = "Sign-in failed: " + e.code; });
$("signout").onclick = () => signOut(auth);

onValue(ref(db, ".info/serverTimeOffset"), s => { offset = s.val() || 0; render(); });
onValue(ref(db, ".info/connected"), s => {
  connected = s.val() === true; if (connected) everConnected = true;
  render();
});

onAuthStateChanged(auth, (u) => {
  unsubs.forEach(f => f()); unsubs = [];
  if (tapUnsub) { tapUnsub(); tapUnsub = null; }
  tap = null; denied = false; state = null; heartbeat = null; songs = {};
  $("signin-box").hidden = !!u; $("app").hidden = !u; $("bar").hidden = !u;
  if (!u) { renderSongs(); return; }
  const no = () => { denied = true; render(); };
  unsubs.push(
    onValue(ref(db, "piano/state"), s => { state = s.val(); render(); }, no),
    onValue(ref(db, "piano/hub"),   s => { heartbeat = s.val(); render(); }, no),
    onValue(ref(db, "piano/songs"), s => { songs = s.val() || {}; renderSongs(); }, no),
  );
});
</script>
</body>
</html>
