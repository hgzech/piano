<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>Piano</title>
<!-- Piano from the phone. Source: hub/web/piano/index.html; published copy: github.com/hgzech/piano (GitHub Pages).
     Reads /piano on the Europe database (hgzech-home); writes only new /piano/cmd records (hub/firebase/database.rules.json). -->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; }
  body { background: #111; color: #eee; font: 18px/1.4 -apple-system, system-ui, sans-serif;
         padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); box-sizing: border-box;
         -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  #status { display: flex; align-items: center; gap: .6rem; font-size: 1.1rem; font-weight: 600; }
  #dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: #666; }
  #dot.on { background: #3c3; } #dot.off { background: #d33; } #dot.wait { background: #888; }
  #warn { min-height: 1.4em; color: #f0a040; }
  #warn.fail { color: #ff6b5b; }
  #stop { width: 100%; padding: 1.1rem; border-radius: 14px; border: 0; background: #333; color: #fff;
          font: 600 1.3rem -apple-system, system-ui, sans-serif; position: relative; touch-action: manipulation; }
  #stop.live { background: #c33; }
  #stop.waiting { outline: 3px solid #e8a317; outline-offset: 3px; }
  ul { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid #222; }
  li { border-bottom: 1px solid #222; }
  li button { width: 100%; display: flex; align-items: center; gap: .8rem; text-align: left; background: none; border: 0;
              color: inherit; font: inherit; padding: .85rem .2rem; touch-action: manipulation; }
  li button:active, #stop:active { opacity: .7; }
  .play { flex: none; width: 2.4rem; height: 2.4rem; border-radius: 50%; background: #2a2a2a; display: grid; place-items: center;
          font-size: .9rem; position: relative; }
  li.current .play { background: #e8a317; color: #111; }
  li.waiting .play::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 3px solid transparent;
                            border-top-color: #e8a317; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .t, .s { display: block; } .s { color: #999; font-size: .9rem; }
  .btn { font-size: 1.1rem; padding: 1rem 2rem; border-radius: 12px; border: 0; background: #2a6df4; color: #fff; align-self: center; }
  #signout { background: none; color: #777; font-size: .9rem; border: 0; padding: .8rem; align-self: center; }
  #empty { color: #888; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
<div id="status"><span id="dot"></span><span id="line">…</span></div>
<div id="warn"></div>
<button id="signin" class="btn" hidden>Sign in with Google</button>
<div id="app" hidden>
  <button id="stop">Stop</button>
  <p id="empty" hidden>No songs on the hub yet.</p>
  <ul id="songs"></ul>
</div>
<button id="signout" hidden>Sign out</button>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getDatabase, ref, push, onValue, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

// Same Firebase project and web config as the plug page (not secret; access is enforced by the database rules).
const firebaseConfig = {
  apiKey: "AIzaSyBlOlfmPbzm5fyTPtsASnBwFhWTRJ816Ac",
  authDomain: "ikea-plug-bridge-hz.firebaseapp.com",
  databaseURL: "https://ikea-plug-bridge-hz-default-rtdb.firebaseio.com",
  projectId: "ikea-plug-bridge-hz",
  storageBucket: "ikea-plug-bridge-hz.firebasestorage.app",
  messagingSenderId: "98941497958",
  appId: "1:98941497958:web:c10640d0b2a0ac42fcf3a7"
};
const DB_URL = "https://hgzech-home.europe-west1.firebasedatabase.app";
const HUB_STALE_MS = 60000;   // heartbeat older than this: hub offline
const FAIL_MS = 15000;        // no result this long after the tap: "no answer from the hub, not played"
const RING_MS = 1000;         // spinner only if the answer takes longer than this

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app, DB_URL);
const $ = (id) => document.getElementById(id);

let state = null, heartbeat = null, songs = {}, offset = 0, unsubs = [];
let connected = null, everConnected = false;   // Firebase connection of THIS phone (.info/connected)
let denied = false;                            // signed-in account isn't allowed by the rules
// This phone's latest tap { id, action, song, cts, rec }. Only its outcome is shown; older taps are ignored.
let tap = null, tapUnsub = null;

const titleOf = (id) => (songs[id] && songs[id].title) || id || "";
const quoted = (id) => `“${titleOf(id)}”`;
const hubUp = () => heartbeat != null && Date.now() + offset - heartbeat < HUB_STALE_MS;
const phoneOffline = () => connected === false && everConnected;
const answered = () => !!(tap && tap.rec && tap.rec.result);
const pending = () => !!tap && !answered() && Date.now() - tap.cts <= FAIL_MS;
const what = (t) => t.action === "stop" ? "Stop" : quoted(t.song);

// What to say about the latest tap: null while waiting or when it simply worked.
function tapFailure() {
  if (!tap) return null;
  const r = tap.rec;
  if (answered()) {
    if (r.result === "failed") return `${what(tap)} failed: ${r.reason || "no reason given"}.`;
    return r.reason ? `${what(tap)}: ${r.reason}.` : null;   // done, but the hub added a note later
  }
  if (Date.now() - tap.cts > FAIL_MS)
    return `${what(tap)}: no answer from the hub, not ${tap.action === "stop" ? "stopped" : "played"}.`;
  return null;
}

function render() {
  let dot = "", line = "…", warn = "";
  const s = state || {};
  const busy = pending(), ring = busy && Date.now() - tap.cts >= RING_MS;
  let current = null;                                    // song shown as playing
  if (!auth.currentUser) {
    dot = ""; line = "Piano";
  } else if (denied) {
    dot = "off"; line = "No access";
    warn = `This Google account (${auth.currentUser && auth.currentUser.email}) isn't allowed. Ask Hilmar to add it.`;
  } else if (phoneOffline()) {
    dot = "wait"; line = "This phone is offline – reconnecting…";
    warn = "No connection from this phone. What you see may be out of date; a tap only counts if it reaches the hub within 10 s.";
  } else if (heartbeat == null && state == null) {
    line = "…";
  } else if (!hubUp()) {
    dot = "off"; line = "Hub offline";
    warn = "The hub at home isn't answering, so nothing can be played or stopped right now.";
  } else if (s.status === "offline") {
    dot = "off"; line = "Piano offline";
    warn = "The hub can't reach the piano board (unplugged or no power?).";
  } else {
    dot = "on";
    if (s.status === "playing") { line = `Playing ${quoted(s.song)}`; current = s.song; }
    else if (s.status === "loading") line = "Loading…";
    else if (s.status === "error") { dot = "off"; line = "Piano problem"; warn = s.error ? `${s.error[0].toUpperCase()}${s.error.slice(1)}.` : ""; }
    else line = "Ready";
    if (busy) {                                          // optimistic: show what the tap is doing
      if (tap.action === "play") { line = `Starting ${quoted(tap.song)}…`; current = tap.song; }
      else { line = "Stopping…"; current = null; }
    }
  }
  const f = tapFailure();
  if (f && !denied) warn = f;
  $("dot").className = dot;
  $("line").textContent = line;
  $("warn").textContent = warn;
  $("warn").classList.toggle("fail", !!f);
  $("stop").classList.toggle("live", !denied && hubUp() && (s.status === "playing" || s.status === "loading"));
  $("stop").classList.toggle("waiting", ring && tap.action === "stop");
  for (const li of $("songs").children) {
    li.classList.toggle("current", li.dataset.id === current);
    li.classList.toggle("waiting", ring && tap.action === "play" && tap.song === li.dataset.id);
  }
}
setInterval(render, 1000);

function renderSongs() {
  const ids = Object.keys(songs).sort((a, b) =>
    titleOf(a).localeCompare(titleOf(b), undefined, { sensitivity: "base", numeric: true }));
  const ul = $("songs");
  ul.replaceChildren();
  for (const id of ids) {
    const s = songs[id] || {};
    const li = document.createElement("li"); li.dataset.id = id;
    const b = document.createElement("button");
    const p = document.createElement("span"); p.className = "play"; p.textContent = "▶";
    const txt = document.createElement("span");
    const t = document.createElement("span"); t.className = "t"; t.textContent = s.title || id;
    txt.append(t);
    const sub = [s.composer, s.performer].filter(Boolean).join(" · ");
    if (sub) { const e = document.createElement("span"); e.className = "s"; e.textContent = sub; txt.append(e); }
    b.append(p, txt);
    b.onclick = () => send("play", id);
    li.append(b); ul.append(li);
  }
  $("empty").hidden = ids.length > 0;
  render();
}

function send(action, song) {
  const u = auth.currentUser;
  if (!u || denied) return;
  const cts = Date.now();
  const rec = { action, by: u.uid, tap: Math.round(cts + offset), ts: serverTimestamp() };
  if (action === "play") rec.song = song;
  const r = push(ref(db, "piano/cmd"), rec);   // queued by the SDK if offline; the hub rejects it if it arrives > 10 s late
  const t = { id: r.key, action, song, cts, rec: null };
  if (tapUnsub) tapUnsub();
  tap = t;
  tapUnsub = onValue(ref(db, "piano/cmd/" + t.id), x => { if (x.val()) { t.rec = x.val(); render(); } }, () => {});
  r.catch(e => { if (tap === t) { t.rec = { result: "failed", reason: `this phone couldn't send it (${e.code || e.message})` }; render(); } });
  render();
  setTimeout(render, RING_MS + 20);
  setTimeout(render, FAIL_MS + 20);
}
$("stop").onclick = () => send("stop");

$("signin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider())
  .catch(e => { $("warn").textContent = "Sign-in failed: " + e.code; });
$("signout").onclick = () => signOut(auth);

onValue(ref(db, ".info/serverTimeOffset"), s => { offset = s.val() || 0; render(); });
onValue(ref(db, ".info/connected"), s => {
  connected = s.val() === true; if (connected) everConnected = true;
  render();
});

onAuthStateChanged(auth, (u) => {
  unsubs.forEach(f => f()); unsubs = [];
  if (tapUnsub) { tapUnsub(); tapUnsub = null; }
  tap = null; denied = false; state = null; heartbeat = null; songs = {};
  $("signin").hidden = !!u; $("app").hidden = !u; $("signout").hidden = !u;
  if (!u) { renderSongs(); return; }
  const no = () => { denied = true; render(); };
  unsubs.push(
    onValue(ref(db, "piano/state"), s => { state = s.val(); render(); }, no),
    onValue(ref(db, "piano/hub"),   s => { heartbeat = s.val(); render(); }, no),
    onValue(ref(db, "piano/songs"), s => { songs = s.val() || {}; renderSongs(); }, no),
  );
});
</script>
</body>
</html>
